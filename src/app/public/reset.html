<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-card"><h1>Reset password</h1><form id="resetForm"><input name="token" placeholder="Reset token / OTP" required><input name="password" type="password" placeholder="New password" required><input name="confirm" type="password" placeholder="Confirm password" required><button>Reset password</button></form><p id="msg"></p><a href="/">Back to login</a></main><script>const p=new URLSearchParams(location.search);resetForm.token.value=p.get('token')||'';resetForm.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(resetForm));const r=await fetch('/api/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});msg.textContent=r.ok?'Password reset. Please log in manually.':(await r.json()).error}</script></body></html>
